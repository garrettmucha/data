name: Test Rocket Runner
on: [push]
jobs:
  test:
    runs-on: [self-hosted, ubuntu, custom, rocket-free]  # ✅ Correct labels
    steps:
      - uses: actions/checkout@v3
      - name: Hello from Rocket Runner! 🚀
        run: |
          echo "🚀 Hello from rocket-data-runner!"
          echo "Running on Akash Network for only $15.30/month!"
          echo "Server info:"
          echo "  CPU cores: $(nproc)"
